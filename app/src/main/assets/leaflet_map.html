<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leaflet Map</title>
    <!-- Use Local Assets for Instant Loading -->
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
            background: #f0f0f0;
        }

        /* Pulse Animation for User Marker */
        .pulse-marker {
            width: 20px;
            height: 20px;
            background: #2563eb;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
        }
        .pulse-marker::after {
            content: "";
            position: absolute;
            top: -10px; left: -10px;
            width: 40px; height: 40px;
            background: rgba(37, 99, 235, 0.4);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .responder-marker {
            width: 24px;
            height: 24px;
            background: #E94560;
            border: 2px solid white;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.6);
        }

        /* Facility Marker for Directory */
        .facility-marker {
            width: 16px;
            height: 16px;
            background: #1877F2;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(24, 119, 242, 0.6);
        }

        .icon-police { background: #1877F2; } /* Blue */
        .icon-medical { background: #10B981; } /* Green */
        .icon-fire { background: #F59E0B; } /* Orange */

        .facility-marker-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 8px;
            font-weight: bold;
        }

        /* Radar Pulse Animation */
        .radar-pulse {
            width: 20px;
            height: 20px;
            background: #E94560;
            border-radius: 50%;
            position: relative;
        }
        .radar-pulse::before, .radar-pulse::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid #E94560;
            border-radius: 50%;
            animation: radar 2s linear infinite;
        }
        .radar-pulse::after { animation-delay: 1s; }
        @keyframes radar {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(8); opacity: 0; }
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
let map;
let userMarker;
let responderMarker;
let routeLayer;
let radarMarker;
let markers = [];

// Custom Icons
const userIcon = L.divIcon({
    className: 'custom-div-icon',
    html: "<div class='pulse-marker'></div>",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
});

const responderIcon = L.divIcon({
    className: 'custom-div-icon',
    html: "<div class='responder-marker'></div>",
    iconSize: [24, 24],
    iconAnchor: [12, 12]
});

const radarIcon = L.divIcon({
    className: 'custom-div-icon',
    html: "<div class='radar-pulse'></div>",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
});

function getFacilityIcon(category) {
    let className = 'facility-marker';
    let iconText = '';

    if (category === 'POLICE') {
        className += ' icon-police';
        iconText = 'P';
    } else if (category === 'MEDICAL') {
        className += ' icon-medical';
        iconText = 'H';
    } else if (category === 'FIRE') {
        className += ' icon-fire';
        iconText = 'F';
    }

    return L.divIcon({
        className: 'custom-div-icon',
        html: `<div class='${className}'><div class='facility-marker-inner'>${iconText}</div></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
    });
}

function initMap() {
    if (map) return;
    map = L.map('map', {
        zoomControl: true,
        attributionControl: false
    }).setView([13.3633, 103.8564], 14);

    // Position Zoom Controls in the Top Right
    map.zoomControl.setPosition('topright');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        detectRetina: true
    }).addTo(map);
}

function setLocation(lat, lng, label) {
    initMap();
    const position = [lat, lng];
    if (!userMarker) {
        userMarker = L.marker(position, { icon: userIcon }).addTo(map);
    } else {
        userMarker.setLatLng(position);
    }

    if (radarMarker) {
        radarMarker.setLatLng(position);
    }

    map.panTo(position);
}

function hideZoomControls() {
    initMap();
    map.zoomControl.remove();
}

function zoomInMap() {
    if (map) map.zoomIn();
}

function zoomOutMap() {
    if (map) map.zoomOut();
}

function startRadar() {
    initMap();
    if (!radarMarker && userMarker) {
        radarMarker = L.marker(userMarker.getLatLng(), { icon: radarIcon, zIndexOffset: -100 }).addTo(map);
    }
}

function stopRadar() {
    if (radarMarker) {
        map.removeLayer(radarMarker);
        radarMarker = null;
    }
}

function setResponder(lat, lng, label) {
    initMap();
    const position = [lat, lng];
    if (!responderMarker) {
        responderMarker = L.marker(position, { icon: responderIcon }).addTo(map);
    } else {
        responderMarker.setLatLng(position);
    }
}

function updateRoute(fromLat, fromLng, toLat, toLng) {
    initMap();
    if (routeLayer) {
        map.removeLayer(routeLayer);
    }
    routeLayer = L.polyline([[fromLat, fromLng], [toLat, toLng]], {
        color: '#E94560',
        weight: 6,
        opacity: 0.6,
        dashArray: '10, 10',
        lineCap: 'round'
    }).addTo(map);
}

function fitToMarkers(userLat, userLng, agentLat, agentLng) {
    initMap();
    const bounds = L.latLngBounds(
        [userLat, userLng],
        [agentLat, agentLng]
    );
    // Added significant bottom padding to clear the BottomSheet (approx 30%)
    map.fitBounds(bounds, {
        paddingTopLeft: [40, 40],
        paddingBottomRight: [40, 300]
    });
}

function addMarker(lat, lng, label, category) {
    initMap();
    const icon = getFacilityIcon(category);
    const marker = L.marker([lat, lng], { icon: icon, title: label }).addTo(map);
    marker.bindPopup("<div style='font-weight:bold; padding:4px;'>" + label + "</div>");
    markers.push(marker);
}

function fitAllMarkers() {
    if (markers.length === 0) return;
    const group = new L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.1), {
        paddingTopLeft: [40, 80],
        paddingBottomRight: [40, 320]
    });
}

function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
}

function zoomTo(lat, lng) {
    initMap();
    map.setView([lat, lng], 17);
}

window.addEventListener('load', initMap);
</script>
</body>
</html>
